name: ci-to-dockerhub

# The release is published by make-release.yml using GITHUB_TOKEN, which by
# design raises no `release` event, so this cannot run from one. The rebuild
# lives in make-release.yml; what is left here is the manual escape hatch.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/findomain:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
