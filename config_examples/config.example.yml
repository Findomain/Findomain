# Findomain configuration file. Every supported key is listed below.
# LEAVE A KEY EMPTY OR DELETE IT IF YOU ARE NOT USING IT.
#
# Any key also works as an environment variable with the FINDOMAIN_ prefix,
# for example FINDOMAIN_SHODAN_API_KEY.
# A source that accepts several keys takes them comma separated.

# == General settings ==
# PostgreSQL connection URI: postgresql://user:password@host:port/database
postgres_connection: ""
# Path to a SQLite file. Set it to use SQLite instead of PostgreSQL
# Where results are stored. Defaults to findomain.db in the working directory
sqlite_path: ""
# Label stored next to every row, groups related targets
jobname: ""
# Discord webhook URL for monitoring alerts
discord_webhook: ""
# Slack webhook URL for monitoring alerts
slack_webhook: ""
# Telegram bot token. Needs telegram_chat_id to be set too
telegrambot_token: ""
# Telegram chat ID
telegram_chat_id: ""
# SMTP server used to email the monitoring report
smtp_server: ""
# SMTP port. 465 uses implicit TLS, anything else STARTTLS. Default 587
smtp_port: ""
# SMTP username, also used as the sender address when it is an email
smtp_user: ""
# SMTP password
smtp_password: ""
# Recipients of the report, comma separated
email_to: ""
# Threads used for IP discovery and HTTP checks. Default 50
lightweight_threads: ""
# Deprecated alias of lightweight_threads
threads: ""
# Concurrent headless browsers. Default 10
screenshots_threads: ""
# Seconds to wait between targets. Default 5
rate_limit: ""
# Seconds allowed for each HTTP status check. Default 5
http_timeout: ""
# Retries per host during the HTTP check. Default 2
http_retries: ""
# Redirects followed by the HTTP check. Default 0
max_http_redirects: ""
# Seconds allowed for each DNS query. Default 3
resolver_timeout: ""
# Seconds a single request to a passive source may take. Default 30
source_timeout: ""
# Seconds the whole passive search may take, 0 for no limit. Default 300
source_budget: ""
# Seconds the archive indexes may spend, 0 to hold them to source_budget. Default 20
archive_budget: ""
# nmap --min-rate, the packets per second floor. 0 lets nmap decide
nmap_min_rate: ""
# Seconds nmap may spend on a single host. Default 900
nmap_host_timeout: ""
# Seconds the whole nmap scan may take. Default 3600
nmap_timeout: ""
# Extra arguments passed to nmap verbatim, one per entry
nmap_args: []
# Path to the nuclei templates to run
nuclei_templates: ""
# Severities to report, comma separated
nuclei_severity: ""
# Template tags to run, comma separated
nuclei_tags: ""
# Templates to skip, comma separated
nuclei_exclude_templates: ""
# nuclei rate limit in requests per second. 0 lets nuclei decide
nuclei_rate_limit: ""
# Seconds the nuclei scan may take. Default 5400
nuclei_timeout: ""
# Extra arguments passed to nuclei verbatim, one per entry
nuclei_args: []
# Path wordlist used by ffuf
ffuf_wordlist: ""
# Concurrent ffuf requests. Default 40
ffuf_threads: ""
# Extra arguments passed to ffuf verbatim, one per entry
ffuf_args: []
# How deep ffuf may recurse. Default 2
ffuf_recursion_depth: ""
# Seconds the ffuf scan may take. Default 5400
ffuf_timeout: ""
# Store results even if a webhook timed out. true or false
dbpush_if_timeout: ""
# Store results without alerting. true or false
no_monitor: ""
# Shuffle the target list instead of walking it in order. true or false
randomize: ""
# Path to a file with one user agent per line
user_agents_file: ""
# Sources to skip, comma separated
exclude_sources: ""
# Files to import subdomains from, comma separated
import_subdomains_from: ""

